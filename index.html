<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Lotto - Shift Audit & Inventory</title>
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./lottoinv.webmanifest">
    <link rel="icon" href="./lotto-icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="./lotto-icon-192.png">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HTML5 QR Code Scanner CDN -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    
    <style>
        /* Responsive grid: 6 cols on desktop, 3 on tablets, minimum 2 cols on mobile */
        .box-grid { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 0.5rem; }
        @media (max-width: 1024px) { .box-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
        @media (max-width: 640px) { .box-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

        @media print {
            @page { size: letter portrait; margin: 0.25in; }
            
            /* Physically remove main UI to prevent blank pages */
            body > header, body > main, body > div.fixed { display: none !important; }
            
            body, html { height: auto !important; margin: 0; padding: 0; background: white !important; overflow: visible !important; }
            
            /* Ensure only the active print area displays */
            #print-worksheet, #print-final-report { display: none !important; }
            
            body.print-mode-worksheet #print-worksheet { display: block !important; }
            body.print-mode-report #print-final-report { display: block !important; }
            
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="bg-gray-100 text-gray-950 font-sans antialiased min-h-screen flex flex-col">

<!-- Top Navigation Bar -->
<header class="bg-slate-900 text-white shadow-md p-4 flex justify-between items-center">
    <div>
        <h1 class="text-xl font-bold tracking-wide">Project Lotto</h1>
        <p id="store-subtitle" class="text-xs text-slate-400">Loading Store Profile...</p>
    </div>
    <div class="flex items-center space-x-2">
        <span id="live-datetime" class="text-xs text-slate-300 hidden sm:inline"></span>
        <button id="install-app" class="hidden bg-emerald-600 hover:bg-emerald-500 text-xs px-3 py-2 rounded font-medium transition">Install App</button>
        <button onclick="openStoreDrawer()" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-2 rounded font-medium border border-slate-700 transition">Store Setup</button>
        <button onclick="openAdminModal()" class="bg-amber-600 hover:bg-amber-500 text-xs px-3 py-2 rounded font-medium transition">Master Admin</button>
    </div>
</header>
